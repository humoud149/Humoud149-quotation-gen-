<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIG Motor Insurance Quotation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@500;600;700;800&display=swap');

  :root{
    --navy: #0b1339;
    --navy-2: #141c4d;
    --gold: #b98a4e;
    --gold-light: #e3c496;
    --cream: #f7f5f0;
    --ink: #1c2340;
    --line: #d8d4c8;
    --muted: #6b7086;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: #e8e6df;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
  }

  .sheet{
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 10px 40px rgba(11,19,57,0.15);
    border-radius: 4px;
    overflow: hidden;
  }

  .sheet[dir="rtl"]{
    direction: rtl;
    text-align: right;
    font-family: 'Cairo', 'Inter', sans-serif;
  }
  .sheet[dir="rtl"] h1,
  .sheet[dir="rtl"] .section-title,
  .sheet[dir="rtl"] .box label,
  .sheet[dir="rtl"] label{ font-family: 'Cairo', sans-serif; }
  .sheet[dir="rtl"] .header{ flex-direction: row-reverse; }
  .sheet[dir="rtl"] .title-block{ text-align: left; }
  .sheet[dir="rtl"] .box .value-row{ flex-direction: row-reverse; justify-content: flex-end; }
  .sheet[dir="rtl"] .addons thead td{ text-align: right; }
  .sheet[dir="rtl"] .footer{ flex-direction: row-reverse; }
  .ltr-field{ direction: ltr !important; text-align: left !important; unicode-bidi: plaintext; }

  .header{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    padding: 36px 44px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 24px;
    position: relative;
  }
  .header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:4px;
    background: linear-gradient(90deg, var(--gold-light), var(--gold) 40%, var(--navy-2) 100%);
  }
  .header img{ height: 54px; }
  .header .title-block{ text-align:right; color:#fff; }
  .header .title-block h1{
    font-family:'Playfair Display', serif;
    font-size: 22px;
    margin:0 0 4px;
    letter-spacing: 0.3px;
    color: #fff;
  }
  .header .title-block .sub{
    font-size: 11px;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .meta{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--cream);
    border-bottom: 1px solid var(--line);
  }
  .meta div{ padding: 12px 18px; border-right: 1px solid var(--line); }
  .meta div:last-child{ border-right:none; }
  .meta label{
    display:block;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .meta .val{ font-size: 13px; font-weight:600; color: var(--ink); }

  .body-pad{ padding: 34px 44px 44px; }

  .section-title{
    font-family:'Playfair Display', serif;
    font-size: 15px;
    color: var(--navy);
    margin: 26px 0 14px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .section-title:first-child{ margin-top: 0; }
  .section-title::after{ content:""; flex:1; height:1px; background: var(--line); }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 18px;
  }
  .field label{
    display:block;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field .val{
    font-size: 13.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    min-height: 1.4em;
  }

  .coverage-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 20px 0;
  }
  .box{
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
    background: var(--cream);
  }
  .box label{
    display:block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight:600;
  }
  .box .value{ font-size: 20px; font-weight:700; color: var(--navy); }
  .box.total{ background: linear-gradient(135deg, var(--navy), var(--navy-2)); border-color: var(--navy); }
  .box.total label{ color: var(--gold-light); }
  .box.total .value{ color: #fff; font-size: 26px; }

  .addons{ border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
  .addons table{ width:100%; border-collapse: collapse; }
  .addons thead td{
    background: var(--navy); color: #fff; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; padding: 10px 14px; font-weight:600;
  }
  .addons tbody tr{ border-top: 1px solid var(--line); }
  .addons tbody td{ padding: 8px 14px; font-size: 13px; }
  .addons td.amt-col{ width: 140px; text-align: right; }
  .addons-footer{
    display:flex; justify-content: space-between; align-items:center;
    padding: 10px 14px; background: var(--cream); border-top: 1px solid var(--line);
    font-size: 13px; font-weight:700; color: var(--navy);
  }

  .terms label{
    display:block; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin-bottom: 8px; font-weight:600;
  }
  .terms-box{
    border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
    font-size: 12.5px; line-height: 1.7; color: var(--ink); background: var(--cream);
    white-space: pre-wrap; word-wrap: break-word;
  }

  .sign-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; }
  .sign-row .field .val{ border-bottom: 1px solid var(--ink); }

  .footer{
    margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line);
    display:flex; justify-content: space-between; align-items:center;
    font-size: 10.5px; color: var(--muted); gap: 16px;
  }
  .footer .note{ font-style: italic; }

  .actions{ max-width: 900px; margin: 16px auto 0; display:flex; justify-content:flex-end; gap: 10px; }
  .actions button{
    border:none; padding: 10px 20px; border-radius: 5px; font-size: 13px;
    font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
    background: var(--navy); color:#fff;
  }
  .actions button:hover{ background: var(--navy-2); }
  .actions .policy-link{
    display:inline-flex; align-items:center;
    border: 1.5px solid var(--navy); padding: 9px 20px; border-radius: 5px;
    font-size: 13px; font-weight:600; font-family:'Inter',sans-serif;
    background: #fff; color: var(--navy); text-decoration:none; cursor:pointer;
  }
  .actions .policy-link:hover{ background: var(--cream); }

  .state-msg{
    max-width: 500px; margin: 80px auto; text-align:center; color: var(--muted);
    font-size: 14px; background:#fff; padding: 40px 30px; border-radius: 8px;
  }

  .ref-page{
    page-break-before: always;
    break-before: page;
    padding-top: 6px;
    font-family: 'Cairo', 'Inter', sans-serif;
  }
  .ref-page .section-title{ font-family: 'Cairo', sans-serif; }
  .ref-subnote{ font-size: 12px; color: var(--muted); margin: -6px 0 14px; font-weight:600; }
  .ref-exclusions{
    margin: 0 0 30px; padding-inline-start: 20px; font-size: 13px; line-height: 2; color: var(--ink);
  }
  .ref-table{
    width:100%; border-collapse: collapse; border: 1px solid var(--line);
    border-radius: 6px; overflow:hidden; font-size: 12.5px;
  }
  .ref-table thead th{ background: var(--navy); color: #fff; text-align: right; padding: 10px 14px; font-size: 11px; }
  .ref-table tbody td{ padding: 8px 14px; border-top: 1px solid var(--line); color: var(--ink); }
  .ref-table tbody td:last-child{ text-align: left; direction: ltr; font-weight:600; color: var(--navy); width: 130px; }
  .ref-table tr.ref-group td{ background: var(--cream); font-weight:700; color: var(--navy); border-top: 1px solid var(--line); }

  @media print{
    body{ background:#fff; padding:0; }
    .actions{ display:none; }
    .sheet{ box-shadow:none; border-radius:0; }
    .box, .addons, .terms-box, .meta, .grid, .coverage-grid, table, tr, .sign-row, .header{
      page-break-inside: avoid; break-inside: avoid;
    }
    .ref-table, .ref-table tbody{ page-break-inside: auto !important; break-inside: auto !important; }
    .ref-table tr{ page-break-inside: avoid; break-inside: avoid; }
  }

  @media (max-width: 700px){
    .grid{ grid-template-columns: 1fr 1fr; }
    .coverage-grid{ grid-template-columns: 1fr; }
    .meta{ grid-template-columns: 1fr 1fr; }
    .sign-row{ grid-template-columns: 1fr; }
    .header{ flex-direction:column; align-items:flex-start; gap:14px; }
    .header .title-block{ text-align:left; }
  }
</style>
</head>

function esc(s){
  const d = document.createElement('div');
  d.textContent = (s === undefined || s === null) ? '' : s;
  return d.innerHTML;
}

function field(label, value, ltr){
  return `<div class="field"><label>${esc(label)}</label><div class="val${ltr ? ' ltr-field' : ''}">${esc(value) || '&nbsp;'}</div></div>`;
}

async function loadQuotation(){

  const content = document.getElementById('content');

    return;
  }

  const { data, error } = await supabaseClient.rpc('get_quotation_public', { p_id: id });
  const row = Array.isArray(data) ? data[0] : data;

    content.innerHTML = `<div class="state-msg">${T.en.notFound}</div>`;
    return;

            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `
    <a class="policy-link" href="policy-wording.pdf" target="_blank" rel="noopener">${esc(t.btnPolicyWording)}</a>
    <button onclick="window.print()">${esc(t.btnPrint)}</button>
  `;
  content.appendChild(actions);

  document.title = row.quote_no ? `${row.quote_no} — GIG Motor Quotation` : 'GIG Motor Quotation';
}

loadQuotation();
</script>
