<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIG Motor Insurance Quotation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@500;600;700;800&display=swap');

  :root{
    --navy: #0b1339;
    --navy-2: #141c4d;
    --gold: #b98a4e;
    --gold-light: #e3c496;
    --cream: #f7f5f0;
    --ink: #1c2340;
    --line: #d8d4c8;
    --muted: #6b7086;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: #e8e6df;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 32px 16px;
  }

  .sheet{
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    box-shadow: 0 10px 40px rgba(11,19,57,0.15);
    border-radius: 4px;
    overflow: hidden;
  }

  .sheet[dir="rtl"]{
    direction: rtl;
    text-align: right;
    font-family: 'Cairo', 'Inter', sans-serif;
  }
  .sheet[dir="rtl"] h1,
  .sheet[dir="rtl"] .section-title,
  .sheet[dir="rtl"] .box label,
  .sheet[dir="rtl"] label{ font-family: 'Cairo', sans-serif; }
  .sheet[dir="rtl"] .header{ flex-direction: row-reverse; }
  .sheet[dir="rtl"] .meta div{ border-right: none; border-left: 1px solid var(--line); }
  .sheet[dir="rtl"] .meta div:nth-child(2n){ border-left: none; }
  .sheet[dir="rtl"] .title-block{ text-align: left; }
  .sheet[dir="rtl"] .box .value-row{ flex-direction: row-reverse; justify-content: flex-end; }
  .sheet[dir="rtl"] .addons thead td{ text-align: right; }
  .sheet[dir="rtl"] .footer{ flex-direction: row-reverse; }
  .ltr-field{ direction: ltr !important; text-align: left !important; unicode-bidi: plaintext; }

  .header{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    padding: 36px 44px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 24px;
    position: relative;
  }
  .header::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:4px;
    background: linear-gradient(90deg, var(--gold-light), var(--gold) 40%, var(--navy-2) 100%);
  }
  .header img{ height: 66px; }
  .header .title-block{ text-align:right; color:#fff; }
  .header .title-block h1{
    font-family:'Playfair Display', serif;
    font-size: 22px;
    margin:0 0 4px;
    letter-spacing: 0.3px;
    color: #fff;
  }
  .header .title-block .sub{
    font-size: 11px;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .meta{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    background: var(--cream);
    border-bottom: 1px solid var(--line);
  }
  .meta div{ padding: 12px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
  .meta div:nth-child(2n){ border-right:none; }
  .meta div:nth-last-child(-n+2){ border-bottom:none; }
  .meta label{
    display:block;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .meta .val{ font-size: 13px; font-weight:600; color: var(--ink); overflow-wrap: break-word; word-break: break-word; }

  .body-pad{ padding: 34px 44px 44px; }

  .section-title{
    font-family:'Playfair Display', serif;
    font-size: 15px;
    color: var(--navy);
    margin: 26px 0 14px;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .section-title:first-child{ margin-top: 0; }
  .section-title::after{ content:""; flex:1; height:1px; background: var(--line); }

  .grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 18px;
  }
  .field label{
    display:block;
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field .val{
    font-size: 13.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    min-height: 1.4em;
  }

  .coverage-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 20px 0;
  }
  .box{
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 16px 18px;
    background: var(--cream);
  }
  .box label{
    display:block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    margin-bottom: 8px;
    font-weight:600;
  }
  .box .value{ font-size: 20px; font-weight:700; color: var(--navy); }
  .box.total{ background: linear-gradient(135deg, var(--navy), var(--navy-2)); border-color: var(--navy); }
  .box.total label{ color: var(--gold-light); }
  .box.total .value{ color: #fff; font-size: 26px; }

  .addons{ border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
  .addons table{ width:100%; border-collapse: collapse; }
  .addons thead td{
    background: var(--navy); color: #fff; font-size: 10px;
    text-transform: uppercase; letter-spacing: 1px; padding: 10px 14px; font-weight:600;
  }
  .addons tbody tr{ border-top: 1px solid var(--line); }
  .addons tbody td{ padding: 8px 14px; font-size: 13px; }
  .addons td.amt-col{ width: 140px; text-align: right; }
  .addons-footer{
    display:flex; justify-content: space-between; align-items:center;
    padding: 10px 14px; background: var(--cream); border-top: 1px solid var(--line);
    font-size: 13px; font-weight:700; color: var(--navy);
  }

  .terms label{
    display:block; font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--muted); margin-bottom: 8px; font-weight:600;
  }
  .terms-box{
    border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px;
    font-size: 12.5px; line-height: 1.7; color: var(--ink); background: var(--cream);
    white-space: pre-wrap; word-wrap: break-word;
  }

  .at-block{ margin-bottom: 22px; }
  .at-group-title{
    font-size: 11px; font-weight:700; color:#fff; background: var(--navy);
    padding: 9px 14px; border-radius: 6px 6px 0 0; letter-spacing:0.6px; text-transform:uppercase;
  }
  .at-table{ width:100%; border-collapse:collapse; border: 1px solid var(--line); border-top:none; }
  .at-table td{ padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12px; line-height:1.6; vertical-align: top; }
  .at-label{
    width: 170px; font-weight:600; color: var(--muted); background: var(--cream);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .at-value{ color: var(--ink); white-space: pre-wrap; word-wrap: break-word; }

  .sign-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 30px; }
  .sign-row .field .val{ border-bottom: 1px solid var(--ink); }

  .footer{
    margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line);
    display:flex; justify-content: space-between; align-items:center;
    font-size: 10.5px; color: var(--muted); gap: 16px;
  }
  .footer .note{ font-style: italic; }

  .actions{ max-width: 900px; margin: 16px auto 0; display:flex; justify-content:flex-end; gap: 10px; }
  .actions button{
    border:none; padding: 10px 20px; border-radius: 5px; font-size: 13px;
    font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
    background: var(--navy); color:#fff;
  }
  .actions button:hover{ background: var(--navy-2); }
  .actions .policy-link{
    display:inline-flex; align-items:center;
    border: 1.5px solid var(--navy); padding: 9px 20px; border-radius: 5px;
    font-size: 13px; font-weight:600; font-family:'Inter',sans-serif;
    background: #fff; color: var(--navy); text-decoration:none; cursor:pointer;
  }
  .actions .policy-link:hover{ background: var(--cream); }

  .state-msg{
    max-width: 500px; margin: 80px auto; text-align:center; color: var(--muted);
    font-size: 14px; background:#fff; padding: 40px 30px; border-radius: 8px;
  }

  .ref-page{
    page-break-before: always;
    break-before: page;
    padding-top: 6px;
    font-family: 'Cairo', 'Inter', sans-serif;
  }
  .ref-page .section-title{ font-family: 'Cairo', sans-serif; }
  .ref-subnote{ font-size: 12px; color: var(--muted); margin: -6px 0 14px; font-weight:600; }
  .ref-exclusions{
    margin: 0 0 30px; padding-inline-start: 20px; font-size: 13px; line-height: 2; color: var(--ink);
  }
  .ref-table{
    width:100%; border-collapse: collapse; border: 1px solid var(--line);
    border-radius: 6px; overflow:hidden; font-size: 12.5px;
  }
  .ref-table thead th{ background: var(--navy); color: #fff; text-align: right; padding: 10px 14px; font-size: 11px; }
  .ref-table tbody td{ padding: 8px 14px; border-top: 1px solid var(--line); color: var(--ink); }
  .ref-table tbody td:last-child{ text-align: left; direction: ltr; font-weight:600; color: var(--navy); width: 130px; }
  .ref-table tr.ref-group td{ background: var(--cream); font-weight:700; color: var(--navy); border-top: 1px solid var(--line); }

  @media print{
    body{ background:#fff; padding:0; }
    .actions{ display:none; }
    .sheet{ box-shadow:none; border-radius:0; }
    .box, .addons, .terms-box, .meta, .grid, .coverage-grid, table, tr, .sign-row, .header{
      page-break-inside: avoid; break-inside: avoid;
    }
    .section-title, .at-group-title{ page-break-after: avoid; break-after: avoid; }
    .at-block{ page-break-inside: avoid; break-inside: avoid; }
    .ref-table, .ref-table tbody{ page-break-inside: auto !important; break-inside: auto !important; }
    .ref-table tr{ page-break-inside: avoid; break-inside: avoid; }
  }

  @media (max-width: 700px){
    .grid{ grid-template-columns: 1fr 1fr; }
    .coverage-grid{ grid-template-columns: 1fr; }
    .meta{ grid-template-columns: 1fr 1fr; }
    .sign-row{ grid-template-columns: 1fr; }
    .header{ flex-direction:column; align-items:flex-start; gap:14px; }
    .header .title-block{ text-align:left; }
  }
</style>
</head>

    atLabelRimsGlass: 'الرنجات والإطارات والزجاج والكاميرات', atLabelTotalLoss: 'نسبة استهلاك الخسارة الكلية',
    addonHeaderName: 'الإضافات / المزايا', addonHeaderAmount: 'المبلغ (د.ك)', addonSubtotalLabel: 'إجمالي الإضافات: د.ك',
    lblTotalPremium: 'إجمالي القسط', secTerms: 'الشروط والأحكام',
    lblPreparedBy: 'أُعد بواسطة', lblContactNumber: 'رقم التواصل',
    footerCompany: 'مجموعة الخليج للتأمين (GIG) — الكويت', footerNote: 'هذا عرض سعر وليس وثيقة تأمين.',
    btnPrint: 'طباعة / حفظ كـ PDF', btnPolicyWording: 'نص وثيقة التأمين (عربي / إنجليزي)', notFound: 'تعذر العثور على هذا العرض أو أنه لم يعد متاحًا.'
  }
};

function esc(s){
  const d = document.createElement('div');
  d.textContent = (s === undefined || s === null) ? '' : s;
  return d.innerHTML;
}

function field(label, value, ltr){
  return `<div class="field"><label>${esc(label)}</label><div class="val${ltr ? ' ltr-field' : ''}">${esc(value) || '&nbsp;'}</div></div>`;
}

async function loadQuotation(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const content = document.getElementById('content');

  if (!id){
    content.innerHTML = `<div class="state-msg">${T.en.notFound}</div>`;
    return;
  }

  const { data, error } = await supabaseClient.rpc('get_quotation_public', { p_id: id });
  const row = Array.isArray(data) ? data[0] : data;

  if (error || !row){
    content.innerHTML = `<div class="state-msg">${T.en.notFound}</div>`;
    return;
  }

  const d = row.data || {};
  const lang = d.language === 'ar' ? 'ar' : 'en';
  const t = T[lang];
  const dir = lang === 'ar' ? 'rtl' : 'ltr';

  const addons = (d.addons || []).filter(a => a.name || a.amount);
  let addonRows = addons.map(a => `
    <tr><td>${esc(a.name)}</td><td class="amt-col ltr-field">${esc(a.amount || '0.000')}</td></tr>`).join('');
  if (!addonRows) addonRows = `<tr><td colspan="2" style="color:var(--muted)">—</td></tr>`;

  let addonSubtotal = 0;
  addons.forEach(a => { addonSubtotal += parseFloat(a.amount) || 0; });

  const repairLocationLabel = d.repairLocation === 'Inside Agency' ? t.optInsideAgency
    : d.repairLocation === 'Outside Agency' ? t.optOutsideAgency
    : '—';

  function atRow(label, value){
    return `<tr><td class="at-label">${esc(label)}</td><td class="at-value">${esc(value || '—')}</td></tr>`;
  }
  const at = d.accidentTerms || {};

  content.innerHTML = `
    <div class="sheet" dir="${dir}">
      <div class="header">
        <img src="data:image/png;base64,${LOGO_B64}" alt="GIG" />
        <div class="title-block">
          <h1>${esc(t.appTitle)}</h1>
          <div class="sub">${esc(t.appSubtitle)}</div>
        </div>
      </div>

      <div class="meta">
        <div><label>${esc(t.lblQuoteNo)}</label><div class="val ltr-field">${esc(row.quote_no)}</div></div>
        <div><label>${esc(t.lblDateIssued)}</label><div class="val ltr-field">${esc(d.dateIssued)}</div></div>
        <div><label>${esc(t.lblValidUntil)}</label><div class="val ltr-field">${esc(d.validUntil)}</div></div>
        <div><label>${esc(t.lblUnderwriter)}</label><div class="val">${esc(d.underwriter)}</div></div>
      </div>

      <div class="body-pad">
        <div class="section-title">${esc(t.secClientDetails)}</div>
        <div class="grid">
          ${field(t.lblClientName, d.clientName)}
          ${field(t.lblCivilId, d.civilId, true)}
          ${field(t.lblMobile, d.mobile, true)}
          ${field(t.lblEmail, d.clientEmail, true)}
          ${field(t.lblPolicyType, d.policyType)}
          ${field(t.lblExistingPolicy, d.existingPolicyNo, true)}
        </div>

        <div class="section-title">${esc(t.secVehicleDetails)}</div>
        <div class="grid">
          ${field(t.lblMake, d.vehicleMake)}
          ${field(t.lblModel, d.vehicleModel)}
          ${field(t.lblYear, d.vehicleYear, true)}
          ${field(t.lblPlate, d.plateNumber, true)}
          ${field(t.lblChassis, d.chassisNo, true)}
          ${field(t.lblUsage, d.usage)}
        </div>

        <div class="section-title">${esc(t.secCoverage)}</div>
        <div class="coverage-grid">
          <div class="box"><label>${esc(t.lblSumInsured)}</label><div class="value ltr-field">KWD ${esc(d.sumInsured || '0.000')}</div></div>
          <div class="box"><label>${esc(t.lblRate)}</label><div class="value ltr-field">${esc(d.rate || '0.00')}%</div></div>
          <div class="box"><label>${esc(t.lblBasePremium)}</label><div class="value ltr-field">KWD ${esc(d.basePremium || '0.000')}</div></div>
        </div>

        <div class="coverage-grid" style="grid-template-columns: 1fr 1fr;">
          <div class="box"><label>${esc(t.lblRepairLocation)}</label><div class="value" style="font-size:15px;">${esc(repairLocationLabel)}</div></div>
          <div class="box"><label>${esc(t.lblSupervisionFee)}</label><div class="value ltr-field">KWD ${esc(d.supervisionFee || '0.000')}</div></div>
        </div>

        <div class="addons">
          <table>
            <thead><tr><td>${esc(t.addonHeaderName)}</td><td class="amt-col">${esc(t.addonHeaderAmount)}</td></tr></thead>
            <tbody>${addonRows}</tbody>
          </table>
          <div class="addons-footer"><span>${esc(t.addonSubtotalLabel)}</span><span class="ltr-field">${addonSubtotal.toFixed(3)}</span></div>
        </div>

        <div class="coverage-grid" style="grid-template-columns: 1fr; margin-bottom: 26px;">
          <div class="box total"><label>${esc(t.lblTotalPremium)}</label><div class="value ltr-field">KWD ${esc(d.totalPremium || '0.000')}</div></div>
        </div>

        <div class="section-title">${esc(t.secAccidentTerms)}</div>

        <div class="at-block">
          <div class="at-group-title">${esc(t.atGroupKnown)}</div>
          <table class="at-table">
            ${atRow(t.atLabelDefinition, at.atKnownDefinition)}
            ${atRow(t.atLabelDeductible, at.atKnownDeductible)}
            ${atRow(t.atLabelDepreciation, at.atKnownDepreciation)}
            ${atRow(t.atLabelWindshield, at.atKnownWindshield)}
            ${atRow(t.atLabelRimsGlass, at.atKnownRimsGlass)}
            ${atRow(t.atLabelTotalLoss, at.atKnownTotalLoss)}
          </table>
        </div>

        <div class="at-block">
          <div class="at-group-title">${esc(t.atGroupUnknown)}</div>
          <table class="at-table">
            ${atRow(t.atLabelDefinition, at.atUnknownDefinition)}
            ${atRow(t.atLabelCoverage, at.atUnknownCoverage)}
            ${atRow(t.atLabelDeductible, at.atUnknownDeductible)}
            ${atRow(t.atLabelDepreciation, at.atUnknownDepreciation)}
            ${atRow(t.atLabelWindshield, at.atUnknownWindshield)}
            ${atRow(t.atLabelRimsGlass, at.atUnknownRimsGlass)}
            ${atRow(t.atLabelTotalLoss, at.atUnknownTotalLoss)}
          </table>
        </div>

        <div class="section-title">${esc(t.secTerms)}</div>
        <div class="terms-box">${esc(d.terms)}</div>

        <div class="sign-row">
          ${field(t.lblPreparedBy, d.preparedBy)}
          ${field(t.lblContactNumber, d.contactNumber, true)}
        </div>

        <div class="footer">
          <span>${esc(t.footerCompany)}</span>
          <span class="note">${esc(t.footerNote)}</span>
        </div>

        <div class="ref-page" dir="rtl">
          <div class="section-title" style="margin-top:0;">استثناءات من التغطية</div>
          <p class="ref-subnote">للحادث المعلوم والمجهول</p>
          <ol class="ref-exclusions">
            <li>السرقة بسبب الإهمال</li>
            <li>الفيضانات وجميع الكوارث الطبيعية بما في ذلك الأمطار</li>
            <li>الحوادث نتيجة السير على الطرق غير المعبدة</li>
            <li>الحروب أو أعمال الشغب</li>
            <li>أي تعديل أو إضافات على السيارة دون إشعار من شركة الخليج للتأمين وإعادة التأمين</li>
          </ol>

          <div class="section-title">تغطيات إضافية (اختيارية)</div>
          <table class="ref-table">
            <thead><tr><th>الإضافات</th><th>د.ك</th></tr></thead>
            <tbody>
              <tr class="ref-group"><td colspan="2">1) 15 يوم سيارة بديلة</td></tr>
              <tr><td>سيارة بديلة فئة صغيرة</td><td>35</td></tr>
              <tr><td>سيارة بديلة فئة متوسطة</td><td>45</td></tr>
              <tr><td>سيارة بديلة فئة كبيرة</td><td>55</td></tr>
              <tr><td>سيارة بديلة فئة فارهة</td><td>200</td></tr>
              <tr class="ref-group"><td colspan="2">2) 20 يوم سيارة بديلة</td></tr>
              <tr><td>سيارة بديلة فئة صغيرة</td><td>40</td></tr>
              <tr><td>سيارة بديلة فئة متوسطة</td><td>50</td></tr>
              <tr><td>سيارة بديلة فئة كبيرة</td><td>70</td></tr>
              <tr><td>سيارة بديلة فئة فارهة</td><td>260</td></tr>
              <tr><td>تغطية الكوارث الطبيعية</td><td>60</td></tr>
              <tr><td>تغطية الحروب</td><td>0.5%</td></tr>
              <tr><td>تغطية التمديد الجغرافي</td><td>1% بحد أدنى 100 د.ك</td></tr>
              <tr><td>تغطية الحوادث الشخصية</td><td>30</td></tr>
              <tr><td>3) خدمة المساعدة على الطريق</td><td>5</td></tr>
              <tr><td>4) عدم حق الرجوع</td><td>30</td></tr>
              <tr><td>5) الحوادث الشخصية</td><td>20</td></tr>
              <tr class="ref-group"><td colspan="2">تغطية حماية السيارة</td></tr>
              <tr><td>لغاية 500 د.ك</td><td>25</td></tr>
              <tr><td>501 د.ك - 1,000 د.ك</td><td>50</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `
    <a class="policy-link" href="policy-wording.pdf" target="_blank" rel="noopener">${esc(t.btnPolicyWording)}</a>
    <button onclick="window.print()">${esc(t.btnPrint)}</button>
  `;
  content.appendChild(actions);

  document.title = row.quote_no ? `${row.quote_no} — GIG Motor Quotation` : 'GIG Motor Quotation';
}

loadQuotation();
</script>

</body>
</html>
